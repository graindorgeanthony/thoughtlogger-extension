<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ThoughtLogger quick capture</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell" id="app">
      <header class="topbar">
        <div class="brand"><img src="../icons/icon32.png" width="28" height="28" alt=""><span>ThoughtLogger</span></div>
        <span class="pending" id="pending" hidden></span>
      </header>

      <section id="connect-view" class="connect-card" hidden>
        <p class="eyebrow">QUICK CAPTURE</p>
        <h1>Catch it before it disappears.</h1>
        <p>Connect once, then send notes, links, selections, and visible screenshots straight to your journal.</p>
        <button class="primary full" id="connect">Connect ThoughtLogger</button>
        <p class="privacy">Nothing from a page is sent until you choose to capture it.</p>
      </section>

      <form id="composer" class="composer" hidden>
        <div class="greeting"><p class="eyebrow" id="daypart">CAPTURE</p><h1>What caught your attention?</h1></div>
        <label for="note">Note</label>
        <textarea id="note" maxlength="20000" placeholder="Half a sentence is fine. Really." rows="6"></textarea>
        <div class="attachments" id="attachments" aria-live="polite"></div>
        <div class="tools" aria-label="Attachments">
          <button type="button" class="tool" id="attach-page" title="Attach this page" aria-label="Attach this page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></svg><span>Page</span>
          </button>
          <button type="button" class="tool" id="screenshot" title="Attach visible screenshot" aria-label="Attach visible screenshot">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3"/></svg><span>Screenshot</span>
          </button>
          <button type="button" class="tool" id="floating" title="Open over this page" aria-label="Open floating composer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H9l-5 4z"/><path d="M8 9h8M8 13h5"/></svg><span>Float</span>
          </button>
        </div>
        <div class="footer-row">
          <div class="type-field"><label for="type">File as</label><select id="type"><option value="auto">Auto</option></select></div>
          <button class="primary" id="submit" type="submit"><span id="submit-label">Log it</span><span class="spinner" aria-hidden="true"></span></button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <footer id="connected-footer" hidden>
        <button class="link-button" id="open-app">Open in ThoughtLogger</button>
        <button class="link-button muted" id="disconnect">Disconnect</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
